        curl -sL https://unpkg.com/@sveltia/cms@VERSI/dist/sveltia-cms.js | openssl dgst -sha384 -binary | openssl base64 -A
    -->
    <script
      src="https://unpkg.com/@sveltia/cms@0.270.0/dist/sveltia-cms.js"
      integrity="sha384-1PWMVQLxD8dGUGyxhuAzW9bW9EK+8qa/c6ntzhkqwb1x/1R58I64fX/zuQy+SgZF"
